<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TalentAI - Zenta</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#256af4",
            "primary-glow": "#256af480",
            "accent-orange": "#ec5b13",
            "accent-purple": "#a855f7",
            "background-dark": "#0B101B",
            "background-card": "#121926",
            "surface-dark": "#162032",
            "surface-dark-lighter": "#1e293b",
            "glass-border": "rgba(255, 255, 255, 0.08)",
            "glass-bg": "rgba(11, 16, 27, 0.7)",
            "text-secondary": "#94a3b8",
            "ui-border": "rgba(255, 255, 255, 0.06)",
          },
          fontFamily: {
            "display": ["Manrope", "sans-serif"],
            "body": ["Manrope", "sans-serif"],
            "sans": ["Manrope", "sans-serif"],
          },
          borderRadius: {
            "3xl": "1.5rem",
            "4xl": "2rem",
          },
          animation: {
            'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'float': 'float 6s ease-in-out infinite',
            'shimmer': 'shimmer 2s linear infinite',
          },
          keyframes: {
            float: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-10px)' },
            },
            shimmer: {
              '100%': { transform: 'translateX(100%)' },
            }
          },
          backdropBlur: {
            xs: '2px',
            '2xl': '40px',
          }
        },
      },
    }
  </script>
  <link href="https://fonts.googleapis.com" rel="preconnect" />
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet" />

  <style>
    /* Shared Global Styles */
    body {
      font-family: 'Manrope', sans-serif;
      background-color: #0B101B;
      color: #cbd5e1;
      margin: 0;
      -webkit-font-smoothing: antialiased;
    }

    /* Smoother scrollbars */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }

    ::-webkit-scrollbar-track {
      background: #0B101B;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #256af480;
    }

    .glass {
      background: rgba(11, 16, 27, 0.6);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .glass-panel {
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(32px) saturate(150%);
      border: 1px solid rgba(255, 255, 255, 0.05);
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
    }

    .glass-card {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.01) 100%);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .glass-card:hover {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.02) 100%);
      border-color: rgba(37, 106, 244, 0.3);
      transform: translateY(-4px);
      box-shadow: 0 20px 40px -20px rgba(37, 106, 244, 0.3);
    }

    .active-nav-item {
      background: linear-gradient(90deg, rgba(37, 106, 244, 0.15) 0%, transparent 100%);
      border-right: 2px solid #256af4;
      color: white;
    }

    .shadow-glow {
      box-shadow: 0 0 20px rgba(37, 106, 244, 0.4);
    }

    .text-glow {
      text-shadow: 0 0 10px rgba(37, 106, 244, 0.3);
    }

    @keyframes fade-in-up {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-fade-in {
      animation: fade-in-up 0.6s ease-out forwards;
    }

    .stagger-1 {
      animation-delay: 0.1s;
    }

    .stagger-2 {
      animation-delay: 0.2s;
    }

    .stagger-3 {
      animation-delay: 0.3s;
    }

    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      vertical-align: middle;
    }
  </style>

</head>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
