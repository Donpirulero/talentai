services:
  frontend:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:8001
    depends_on:
      - backend

  backend:
    build: ./backend_engine
    ports:
      - "8001:8001"
    volumes:
      - ./backend_engine:/app
    env_file:
      - .env
